name: Asmo validation and Mac build

on:
  push:
    branches: [main, asmo/queued-message-steering]

permissions:
  contents: read

concurrency:
  group: asmo-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    if: github.repository == 'asmoyou/cc-connect'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Check Go formatting
        run: |
          files=$(gofmt -l core/queued_steering.go core/queued_steering_test.go core/cuj_test.go core/i18n.go core/interfaces.go platform/feishu/card.go platform/feishu/feishu.go platform/feishu/queued_steering_test.go platform/feishu/card_action_update_test.go)
          if [ -n "$files" ]; then
            printf '%s\n' "$files"
            while IFS= read -r file; do
              gofmt -d "$file"
            done <<< "$files"
            exit 1
          fi
      - name: Build web assets
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Build and run full tests
        run: |
          go build ./...
          go test ./...
      - name: Lint changed Go code
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.11.4
          "$(go env GOPATH)/bin/golangci-lint" run --new-from-rev origin/main ./...
      - name: Run critical user journeys and interaction race checks
        run: |
          go test ./core/ -run TestCUJ
          go test -race ./core ./platform/feishu ./agent/codex -run 'TestQueuedSteering|TestCUJ_C6|TestInteractivePlatform_QueuedSteeringCallbacks|TestUpdateActionCard|TestSendTrackedCard|TestAppServerSession_.*Idle'
      - name: Confirm regression test detects the original bug
        run: |
          original=$(mktemp)
          cp core/engine.go "$original"
          trap 'cp "$original" core/engine.go; rm -f "$original"' EXIT
          sed -i '/^[[:space:]]*e.markQueuedMessageProcessing(queued)$/d' core/engine.go
          if go test ./core/ -run '^TestCUJ_C6_QueuedMessageDeliveryChoice/automatic_without_click$' > regression-before.log 2>&1; then
            cat regression-before.log
            echo 'Regression test unexpectedly passed before the fix'
            exit 1
          fi
          cat regression-before.log
          grep -q 'automatically delivered card still has active choices' regression-before.log
      - name: Build Mac arm64 binary
        env:
          GOOS: darwin
          GOARCH: arm64
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist/asmo
          version=v1.5.1-beta.4.steering.3
          commit=$(git rev-parse --short HEAD)
          built=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          go build -tags goolm -ldflags "-s -w -X main.version=$version -X main.commit=$commit -X main.buildTime=$built" -o dist/asmo/cc-connect ./cmd/cc-connect
          cd dist/asmo
          shasum -a 256 cc-connect > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: cc-connect-darwin-arm64-${{ github.sha }}
          path: dist/asmo/
          retention-days: 14
          if-no-files-found: error
