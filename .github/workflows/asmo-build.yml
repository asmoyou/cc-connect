name: Asmo validation and release builds

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: asmo-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    if: github.repository == 'asmoyou/cc-connect'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Check Go formatting
        run: |
          files=$(gofmt -l core/queued_steering.go core/queued_steering_test.go core/cuj_test.go core/i18n.go core/interfaces.go platform/feishu/card.go platform/feishu/feishu.go platform/feishu/queued_steering_test.go platform/feishu/card_action_update_test.go core/session_switch.go core/session_switch_test.go core/session_id_validation_test.go core/session_teardown_test.go core/relay_test.go core/engine_test.go agent/codex/appserver_session.go agent/codex/appserver_session_test.go agent/acp/session.go agent/acp/session_resume_test.go agent/copilot/session.go agent/copilot/session_resume_test.go)
          if [ -n "$files" ]; then
            printf '%s\n' "$files"
            while IFS= read -r file; do
              gofmt -d "$file"
            done <<< "$files"
            exit 1
          fi
      - name: Build web assets
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Build and run full tests
        run: |
          go build ./...
          go test ./...
      - name: Lint changed Go code
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.11.4
          "$(go env GOPATH)/bin/golangci-lint" run --new-from-rev origin/main ./...
      - name: Run critical user journeys and interaction race checks
        run: |
          go test ./core/ -run TestCUJ
          go test -race ./core ./platform/feishu ./agent/codex ./agent/acp ./agent/copilot -run 'TestQueuedSteering|TestCUJ_C6|TestInteractivePlatform_QueuedSteeringCallbacks|TestUpdateActionCard|TestSendTrackedCard|TestAppServerSession_.*Idle|TestCUJ_B3|TestSwitchPreview|TestUnsafeResume|TestResumeFailure|TestIssue599|TestHandleRelay_Resume|TestHandshake_|TestAppServerSession_.*Resume'
      - name: Confirm regression test detects the original bug
        run: |
          original=$(mktemp)
          cp core/engine.go "$original"
          trap 'cp "$original" core/engine.go; rm -f "$original"' EXIT
          sed -i '/^[[:space:]]*e.markQueuedMessageProcessing(queued)$/d' core/engine.go
          if go test ./core/ -run '^TestCUJ_C6_QueuedMessageDeliveryChoice/automatic_without_click$' > regression-before.log 2>&1; then
            cat regression-before.log
            echo 'Regression test unexpectedly passed before the fix'
            exit 1
          fi
          cat regression-before.log
          grep -q 'automatically delivered card still has active choices' regression-before.log
      - name: Confirm card retry regression detects exhausted updates
        run: |
          original=$(mktemp)
          cp core/queued_steering.go "$original"
          trap 'cp "$original" core/queued_steering.go; rm -f "$original"' EXIT
          sed -i '/^[[:space:]]*go e.retryQueuedChoice(receipt)$/d' core/queued_steering.go
          if go test ./core/ -run '^TestCUJ_C6_QueuedMessageDeliveryChoice/automatic_card_update_recovers$' > retry-regression-before.log 2>&1; then
            cat retry-regression-before.log
            echo 'Card retry regression unexpectedly passed without retry scheduling'
            exit 1
          fi
          cat retry-regression-before.log
          grep -q 'async question journey did not reach expected state' retry-regression-before.log
      - name: Build and package Mac and Linux arm64 binaries
        env:
          GOARCH: arm64
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          mkdir -p dist/asmo/release
          version=v1.5.1-beta.4.steering.5
          commit=$(git rev-parse --short HEAD)
          built=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          for target in darwin linux; do
            target_dir="dist/asmo/$target-arm64"
            mkdir -p "$target_dir"
            GOOS="$target" go build -tags goolm -ldflags "-s -w -X main.version=$version -X main.commit=$commit -X main.buildTime=$built" -o "$target_dir/cc-connect" ./cmd/cc-connect
            (cd "$target_dir" && sha256sum cc-connect > SHA256SUMS)
            tar -czf "dist/asmo/release/cc-connect-$target-arm64.tar.gz" -C "$target_dir" cc-connect SHA256SUMS
          done
          (cd dist/asmo/release && sha256sum ./*.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: cc-connect-darwin-arm64-${{ github.sha }}
          path: dist/asmo/darwin-arm64/
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: cc-connect-linux-arm64-${{ github.sha }}
          path: dist/asmo/linux-arm64/
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: asmo-release-assets-${{ github.sha }}
          path: dist/asmo/release/
          retention-days: 14
          if-no-files-found: error

  linux-arm64-smoke:
    needs: validate-and-build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: asmo-release-assets-${{ github.sha }}
          path: dist
      - name: Verify and run the release archive on Ubuntu ARM64
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          cd dist
          sha256sum --check SHA256SUMS
          mkdir extracted
          tar -xzf cc-connect-linux-arm64.tar.gz -C extracted
          cd extracted
          sha256sum --check SHA256SUMS
          test -x cc-connect
          file cc-connect | grep 'ARM aarch64'
          ./cc-connect --version | tee version.txt
          grep -F "${EXPECTED_SHA:0:7}" version.txt
          ./cc-connect --help

  publish:
    if: github.ref == 'refs/heads/main'
    needs: [validate-and-build, linux-arm64-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: asmo-release-assets-${{ github.sha }}
          path: dist
      - name: Publish the fork's rolling preview release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_SHA: ${{ github.sha }}
          BUILD_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check SHA256SUMS)
          cat > release-notes.md <<EOF
          Fork build of cc-connect v1.5.1-beta.4.steering.4, including queued-message card improvements and safe session switching with latest-message previews.

          Commit: $BUILD_SHA
          Build and checks: $BUILD_RUN_URL

          Downloads: macOS Apple Silicon (darwin/arm64) and Linux ARM64 (Ubuntu aarch64).
          Each archive contains the executable and its SHA256SUMS. Linux ARM64 was run on a native Ubuntu ARM runner.

          This rolling preview is replaced after successful main builds. Official npm and cc-connect update commands still use the upstream repository.
          Installation: https://github.com/asmoyou/cc-connect/blob/main/docs/asmo-builds.md
          EOF
          if gh release view asmo-latest >/dev/null 2>&1; then
            gh release upload asmo-latest dist/* --clobber
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/asmo-latest" -f sha="$BUILD_SHA" -F force=true
            gh release edit asmo-latest --title 'Asmo latest preview (macOS and Linux ARM64)' --notes-file release-notes.md --prerelease
          else
            gh release create asmo-latest dist/* --target "$BUILD_SHA" --title 'Asmo latest preview (macOS and Linux ARM64)' --notes-file release-notes.md --prerelease
          fi
